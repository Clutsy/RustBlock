name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x86_64
          - os: ubuntu-latest
            platform: linux-x86_64
          - os: macos-15-intel
            platform: macos-x86_64
          - os: macos-15
            platform: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libgl1-mesa-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev

      - name: Build release binaries
        run: cargo build --release --locked

      - name: Build Windows packages
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" "packaging\windows\RustBlock.iss"
          New-Item -ItemType Directory -Force dist\portable\cli | Out-Null
          Copy-Item target\release\rustblock-gui.exe dist\portable\RustBlock.exe
          Copy-Item target\release\rustblock.exe dist\portable\cli\rustblock.exe
          Copy-Item README.md, LICENSE, NOTICE dist\portable\
          if (-not (Test-Path dist\portable\RustBlock.exe)) { throw "GUI missing from portable ZIP" }
          if (-not (Test-Path dist\portable\cli\rustblock.exe)) { throw "CLI missing from portable ZIP" }
          Compress-Archive -Path dist\portable\* -DestinationPath "dist\RustBlock-$version-portable.zip" -Force

      - name: Build Unix package
        if: runner.os != 'Windows'
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist/pkg/cli
          cp target/release/rustblock-gui dist/pkg/RustBlock
          cp target/release/rustblock dist/pkg/cli/rustblock
          cp README.md LICENSE NOTICE dist/pkg/
          chmod +x dist/pkg/RustBlock dist/pkg/cli/rustblock
          test -x dist/pkg/RustBlock
          test -x dist/pkg/cli/rustblock
          if [ "${{ runner.os }}" = "macOS" ]; then
            codesign --force --sign - dist/pkg/RustBlock dist/pkg/cli/rustblock
          fi
          archive="dist/RustBlock-${version}-${{ matrix.platform }}.tar.gz"
          tar -czf "$archive" -C dist/pkg .
          listing=$(tar -tzf "$archive")
          grep -qx './RustBlock' <<<"$listing"
          grep -qx './cli/rustblock' <<<"$listing"

      - uses: actions/upload-artifact@v4
        with:
          name: RustBlock-${{ matrix.platform }}
          path: |
            dist/RustBlock-*.exe
            dist/RustBlock-*.zip
            dist/RustBlock-*.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: RustBlock-*
          merge-multiple: true

      - name: Verify tag and build checksums
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(awk '/^\[workspace.package\]/{found=1} found && /^version = /{gsub(/[",]/,""); print $3; exit}' Cargo.toml)
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag v$tag does not match the workspace version $version."
            exit 1
          fi
          cd dist
          sha256sum RustBlock-* > SHA256SUMS.txt
          ls -lh

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: RustBlock ${{ github.ref_name }}
          body: |
            Native builds for Windows, Linux and macOS.

            | Platform | Asset |
            |---|---|
            | Windows 10/11 x64 | `RustBlock-Setup-*.exe` installer, `RustBlock-*-portable.zip` |
            | Linux x86_64 | `RustBlock-*-linux-x86_64.tar.gz` |
            | macOS Apple Silicon | `RustBlock-*-macos-arm64.tar.gz` |
            | macOS Intel | `RustBlock-*-macos-x86_64.tar.gz` |

            The Windows installer is per-user (no elevation) and supports silent OTA
            updates from Settings → Updates. The portable ZIP and the Linux/macOS
            archives keep the GUI at the root and the CLI in `cli/`. macOS builds are
            ad-hoc signed but not notarized: if Gatekeeper blocks the first launch,
            right-click → Open, or remove the quarantine attribute.

            Every archive is covered by `SHA256SUMS.txt`.
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
