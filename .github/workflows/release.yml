name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build binaries
        run: cargo build --release --locked

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" "packaging\windows\RustBlock.iss"

      - name: Build portable package
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          New-Item -ItemType Directory -Force dist\portable | Out-Null
          Copy-Item target\release\rustblock-gui.exe dist\portable\RustBlock.exe
          Copy-Item target\release\rustblock.exe dist\portable\rustblock.exe
          Copy-Item README.md, LICENSE, NOTICE dist\portable\
          Compress-Archive -Path dist\portable\* -DestinationPath "dist\RustBlock-$version-portable.zip" -Force

      - name: Write checksums
        shell: pwsh
        run: |
          Get-ChildItem dist\RustBlock-Setup-*.exe, dist\RustBlock-*-portable.zip |
            ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } |
            Set-Content -Encoding ascii dist\SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: RustBlock ${{ github.ref_name }}
          body: |
            Native Windows build of RustBlock.

            - `RustBlock-Setup-*.exe` — per-user installer with Start Menu and optional desktop shortcut.
            - `RustBlock-*-portable.zip` — standalone GUI and CLI, no installation required.
            - `SHA256SUMS.txt` — checksums for both downloads.

            The installed app checks GitHub Releases on launch and can download the next
            installer from Settings → Updates.
          files: |
            dist/RustBlock-Setup-*.exe
            dist/RustBlock-*-portable.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
