[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "crates/gui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.92"

[workspace.dependencies]
thiserror = "2"
half = "2"
tempfile = "3"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
indicatif = "0.17"
serde_json = "1"
eframe = { version = "0.35", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
rfd = "0.17"
ureq = { version = "2", features = ["json"] }
urlencoding = "2"
image = { version = "0.25", default-features = false, features = ["png"] }
rayon = "1.10"
regex = "1"
sha2 = "0.10"
