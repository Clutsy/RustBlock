[workspace]
resolver = "2"
members = ["crates/core", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.80"

[workspace.dependencies]
thiserror = "2"
half = "2"
tempfile = "3"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
indicatif = "0.17"
serde_json = "1"
